# pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unsealer"
dynamic = ["version"]
authors = [
  { name="Chase Chen", email="eldric520lol@gmail.com" },
]
description = "Decrypt Samsung Pass and Google Authenticator data"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
    "Environment :: Console",
]
keywords = ["samsung", "google", "authenticator",".spass", "decrypt", "password", "manager", "export",]

dependencies = [
    "pycryptodome>=3.15.0",
    "rich",
    "pyfiglet",
    "pyzbar",
    "pillow",
]
# linux用户可能需要安装系统库
# sudo apt-get install libzbar0

[project.scripts]
unsealer = "unsealer.__main__:main"

[project.urls]
Homepage = "https://github.com/Cardioider/Vespera"
"Bug Tracker" = "https://github.com/Cardioider/Vespera/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["unsealer*"]

[tool.setuptools.dynamic]
version = {attr = "unsealer.__version__"}

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]


# 打包工具
[tool.setuptools.package-data]
"unsealer.samsung" = ["*.json"]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "qrcode>=7.3",
]
