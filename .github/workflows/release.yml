name: Test, Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimum-python:
    name: Test Python 3.9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q

  build:
    name: Test and build for ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: unsealer
            asset_name: unsealer-linux-x64
          - os: windows-latest
            artifact_name: unsealer.exe
            asset_name: unsealer-windows-x64.exe
          - os: macos-15-intel
            artifact_name: unsealer
            asset_name: unsealer-macos-x64
          - os: macos-15
            artifact_name: unsealer
            asset_name: unsealer-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system QR dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libzbar0
          else
            brew install zbar
          fi

      - name: Install build and test dependencies
        run: python -m pip install ".[test]" build pyinstaller

      - name: Run regression tests
        run: python -m pytest -q

      - name: Build and inspect Python distributions
        shell: bash
        run: |
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python scripts/smoke_test.py

      - name: Build executable
        shell: bash
        run: |
          EXTRA_BINARIES=()
          if [ "$RUNNER_OS" == "macOS" ]; then
            EXTRA_BINARIES+=(--add-binary "$(brew --prefix zbar)/lib/libzbar.dylib:.")
          fi
          pyinstaller --onefile --name unsealer --clean --noconfirm \
            "${EXTRA_BINARIES[@]}" \
            --collect-data pyfiglet \
            --collect-binaries pyzbar \
            --collect-data unsealer.samsung \
            src/unsealer/__main__.py

      - name: Test executable with synthetic URI, JSON and QR inputs
        run: python scripts/smoke_test.py --executable dist/${{ matrix.artifact_name }}

      - name: Rename executable
        shell: bash
        run: mv "dist/${{ matrix.artifact_name }}" "dist/${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [minimum-python, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./assets
      - uses: softprops/action-gh-release@v2
        with:
          files: ./assets/**/*
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
